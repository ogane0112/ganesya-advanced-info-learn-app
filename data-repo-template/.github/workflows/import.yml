name: import

# 過去問道場 (既定) または IPA 公式 PDF から午後問題を取得し、Claude が questions/ に変換して commit する
on:
  workflow_dispatch:
    inputs:
      year:
        description: "年度 (西暦。例: 2024)"
        required: true
      season:
        description: "期"
        required: true
        type: choice
        options: [spring, autumn]
      questions:
        description: "取り込む問 (例: 1-11 / 1,3,5)"
        required: false
        default: "1-11"
      source:
        description: "取り込み元"
        type: choice
        options: [apsiken, ipa]
        default: apsiken

concurrency:
  group: import
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      YEAR: ${{ inputs.year }}
      SEASON: ${{ inputs.season }}
      QUESTIONS: ${{ inputs.questions }}
      SOURCE: ${{ inputs.source }}
    steps:
      - name: Validate inputs
        run: |
          [[ "$YEAR" =~ ^20[0-9]{2}$ ]] || { echo "year は西暦4桁"; exit 1; }
          [[ "$QUESTIONS" =~ ^[0-9,\ -]+$ ]] || { echo "questions は 1-11 / 1,3,5 の形式"; exit 1; }

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
          npm ci

      - name: Configure git
        run: |
          git config user.name "claude-importer[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch pages from 過去問道場
        if: inputs.source == 'apsiken'
        run: node scripts/fetch-apsiken.mjs --year "$YEAR" --season "$SEASON" --q "$QUESTIONS"

      - name: Fetch IPA answer PDF (解答例・採点講評)
        if: inputs.source == 'apsiken'
        continue-on-error: true
        run: node scripts/fetch-ipa.mjs --year "$YEAR" --season "$SEASON" --kinds ans,cmnt

      - name: Fetch PDFs from IPA
        if: inputs.source == 'ipa'
        run: node scripts/fetch-ipa.mjs --year "$YEAR" --season "$SEASON"

      - name: Show fetched files
        run: ls -laR "apsiken-raw/$YEAR-$SEASON" "ipa-pdf/$YEAR-$SEASON" 2>/dev/null || true

      - name: Convert with Claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            IMPORT.md のルールに従って、${{ inputs.year }}-${{ inputs.season }} の問 ${{ inputs.questions }} を
            取り込み元「${{ inputs.source == 'apsiken' && '過去問道場 (apsiken-raw/)' || 'IPA 公式 PDF (ipa-pdf/)' }}」から questions/ に取り込み、commit して push してください。
            過去問道場の場合、取り込むのは問題文・図表・設問だけで、解説は取り込まないこと。
          claude_args: >-
            --max-turns 250
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(pdftotext:*),Bash(pdftoppm:*),Bash(pdfinfo:*),Bash(ls:*),Bash(mkdir:*),Bash(cp:*),Bash(node scripts/check-questions.mjs:*),Bash(git status:*),Bash(git add:*),Bash(git commit:*),Bash(git pull:*),Bash(git push:*),Bash(git log:*),Bash(git diff:*)"

      - name: Validate
        run: |
          git pull --ff-only origin main || true
          node scripts/check-questions.mjs "questions/$YEAR-$SEASON"
