name: import

# IPA 公式サイトから午後の PDF をスクレイピングし、Claude が questions/ に変換して commit する
on:
  workflow_dispatch:
    inputs:
      year:
        description: "年度 (西暦。例: 2024)"
        required: true
      season:
        description: "期"
        required: true
        type: choice
        options: [spring, autumn]
      questions:
        description: "取り込む問 (例: 1-11 / 1,3,5)"
        required: false
        default: "1-11"

concurrency:
  group: import
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      YEAR: ${{ inputs.year }}
      SEASON: ${{ inputs.season }}
      QUESTIONS: ${{ inputs.questions }}
    steps:
      - name: Validate inputs
        run: |
          [[ "$YEAR" =~ ^20[0-9]{2}$ ]] || { echo "year は西暦4桁"; exit 1; }
          [[ "$QUESTIONS" =~ ^[0-9,\ -]+$ ]] || { echo "questions は 1-11 / 1,3,5 の形式"; exit 1; }

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
          npm ci

      - name: Configure git
        run: |
          git config user.name "claude-importer[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch PDFs from IPA
        run: node scripts/fetch-ipa.mjs --year "$YEAR" --season "$SEASON"

      - name: Show fetched files
        run: ls -la "ipa-pdf/$YEAR-$SEASON" && cat ipa-pdf/manifest.json

      - name: Convert with Claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            IMPORT.md のルールに従って、ipa-pdf/${{ inputs.year }}-${{ inputs.season }}/ の PDF から
            ${{ inputs.year }}-${{ inputs.season }} の問 ${{ inputs.questions }} を questions/ に取り込み、commit して push してください。
          claude_args: >-
            --max-turns 250
            --allowedTools "Read,Write,Edit,Glob,Grep,Bash(pdftotext:*),Bash(pdftoppm:*),Bash(pdfinfo:*),Bash(ls:*),Bash(mkdir:*),Bash(node scripts/check-questions.mjs:*),Bash(git status:*),Bash(git add:*),Bash(git commit:*),Bash(git pull:*),Bash(git push:*),Bash(git log:*),Bash(git diff:*)"

      - name: Validate
        run: |
          git pull --ff-only origin main || true
          node scripts/check-questions.mjs "questions/$YEAR-$SEASON"
